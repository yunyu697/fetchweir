name: tag-version-check

# tag 只作为版本标记，不再发版：
#   · 不创建 Release，不上传任何安装包或清单资产；
#   · 不读取 FW_SIGNING_KEY / FW_RELEASES_PAT 等 secret；
#   · 只校验 tag 与 version.json 是否一致（版本标记要有唯一来源）。
# 安装包全部在本地生成：pwsh tools/Build-Fw.ps1 -FwTask release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: 版本标记校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 与 version.json 一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: ./tools/Test-FwVersion.ps1 -FwTag "${{ github.ref_name }}"

      - name: 校验 version.json 格式
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        run: ./tools/Test-FwVersion.ps1
