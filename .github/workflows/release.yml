name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 打包 (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            bundles: nsis
            triple: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            label: linux-x64
            bundles: deb,appimage
            triple: x86_64-unknown-linux-gnu
          - os: macos-latest
            label: macos
            bundles: dmg
            triple: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 同步视频解析器 sidecar
        shell: pwsh
        run: ./tools/Sync-FwYtdlp.ps1 -FwTriple ${{ matrix.triple }}

      - name: 校验 tag 与版本号
        shell: pwsh
        run: ./tools/Test-FwVersion.ps1 -FwTag "${{ github.ref_name }}"

      - name: 安装 Linux 系统依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libssl-dev build-essential curl wget file

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装前端依赖
        run: npm ci --no-audit --no-fund

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Fetchweir ${{ github.ref_name }}"
          releaseBody: |
            Fetchweir ${{ github.ref_name }} 构建产物。

            · Windows: NSIS 当前用户包（无需 UAC）+ 所有用户包（需 UAC）
            · Linux: deb / AppImage
            · macOS: 未签名 dmg（未公证，首次打开需手动放行）

            已知未验证：真实注销登录触发 ONLOGON、深色任务栏托盘实拍、多用户并发登录、
            macOS 公证、Linux 系统级安装。完整说明与未验证原因见仓库
            `docs/release-notes-v1.0.0.md`。
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') }}
          args: --bundles ${{ matrix.bundles }}

      # 当前用户安装包默认不需要 UAC；「所有用户」模式单独打一个包，
      # 在 NSIS 中把安装范围固定为 perMachine（安装时请求管理员权限）。
      - name: 构建「所有用户」安装包
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $fwVersion = (Get-Content version.json -Raw | ConvertFrom-Json).version
          npm run tauri build -- --bundles nsis --config '{"bundle":{"windows":{"nsis":{"installMode":"perMachine"}}}}'
          $fwSetup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $fwDst = Join-Path $fwSetup.Directory "Fetchweir_${fwVersion}_x64-setup-allusers.exe"
          Copy-Item $fwSetup.FullName $fwDst
          gh release upload "${{ github.ref_name }}" $fwDst --clobber
