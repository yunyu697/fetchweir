name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 打包 (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            bundles: nsis
            triple: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            label: linux-x64
            bundles: deb,appimage
            triple: x86_64-unknown-linux-gnu
          - os: macos-latest
            label: macos
            bundles: dmg
            triple: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 同步视频解析器 sidecar
        shell: pwsh
        run: ./tools/Sync-FwYtdlp.ps1 -FwTriple ${{ matrix.triple }}

      - name: 校验 tag 与版本号
        shell: pwsh
        run: ./tools/Test-FwVersion.ps1 -FwTag "${{ github.ref_name }}"

      - name: 安装 Linux 系统依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libssl-dev build-essential curl wget file

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装前端依赖
        run: npm ci --no-audit --no-fund

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Fetchweir ${{ github.ref_name }}"
          releaseBody: |
            Fetchweir ${{ github.ref_name }} 构建产物。

            · Windows: NSIS 当前用户包（无需 UAC）+ 所有用户包（需 UAC）
            · Linux: deb / AppImage
            · macOS: 未签名 dmg（未公证，首次打开需手动放行）

            已知未验证：真实注销登录触发 ONLOGON、深色任务栏托盘实拍、多用户并发登录、
            macOS 公证、Linux 系统级安装。完整说明与未验证原因见仓库
            `docs/release-notes-v1.0.0.md`。
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') }}
          args: --bundles ${{ matrix.bundles }}

      # 当前用户安装包默认不需要 UAC；「所有用户」模式单独打一个包，
      # 在 NSIS 中把安装范围固定为 perMachine（安装时请求管理员权限）。
      - name: 构建「所有用户」安装包
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $fwVersion = (Get-Content version.json -Raw | ConvertFrom-Json).version
          $fwUser = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $fwUserHash = (Get-FileHash $fwUser.FullName -Algorithm SHA256).Hash
          # 两种范围产出同名文件，perMachine 构建会覆盖用户级包，先另存一份用于对照。
          $fwUserCopy = Join-Path $env:RUNNER_TEMP 'user-scope-setup.exe'
          Copy-Item $fwUser.FullName $fwUserCopy -Force
          # 配置写文件再传路径：内联 JSON 的引号会被 pwsh 解析掉，tauri 收到的是无引号的非法 JSON。
          $fwCfg = Join-Path $env:RUNNER_TEMP 'per-machine.json'
          '{"bundle":{"windows":{"nsis":{"installMode":"perMachine"}}}}' | Set-Content -Path $fwCfg -Encoding utf8
          npm run tauri build -- --bundles nsis --config $fwCfg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fwSetup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $fwDst = Join-Path $fwSetup.Directory "Fetchweir_${fwVersion}_x64-setup-allusers.exe"
          Copy-Item $fwSetup.FullName $fwDst -Force
          if ((Get-FileHash $fwDst -Algorithm SHA256).Hash -eq $fwUserHash) {
            throw 'perMachine 包与用户级包字节相同，--config 未生效'
          }
          # 用安装包内嵌的清单执行级别复核：所有用户包必须要求管理员，用户级包必须不要求。
          $fwAll = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($fwDst))
          $fwMe = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($fwUserCopy))
          if ($fwAll -notmatch 'requireAdministrator' -or $fwMe -match 'requireAdministrator') {
            throw '安装包执行级别与安装范围不符'
          }
          gh release upload "${{ github.ref_name }}" $fwDst --clobber

  # 源码仓库保持私有：把产物、latest.json 与签名推到公开「发布产物」仓库，
  # 客户端只读公开仓库，不携带任何令牌。
  # 需要两个 secret：FW_RELEASES_PAT（公开仓库写权限）、FW_SIGNING_KEY（Ed25519 私钥）。
  publish-public:
    name: 发布到公开仓库
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 拉取本次 Release 产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir dist --clobber

      - name: 生成签名清单并推送
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.FW_RELEASES_PAT }}
          FW_RELEASES_PAT: ${{ secrets.FW_RELEASES_PAT }}
          FW_SIGNING_KEY: ${{ secrets.FW_SIGNING_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FW_RELEASES_PAT)) {
            Write-Host '跳过：未配置 FW_RELEASES_PAT（公开仓库写权限的 PAT）'
            exit 0
          }
          ./tools/Publish-FwRelease.ps1 -FwTag "$env:GITHUB_REF_NAME" -FwDir dist
