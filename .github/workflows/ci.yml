name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  version:
    name: 版本号校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验 version.json
        shell: pwsh
        run: ./tools/Test-FwVersion.ps1

  rust:
    name: 编译与测试 (${{ matrix.os }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
          - os: macos-latest
            triple: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 同步视频解析器 sidecar
        shell: pwsh
        run: ./tools/Sync-FwYtdlp.ps1 -FwTriple ${{ matrix.triple }}

      - name: 同步 ffmpeg sidecar（纯视频流合并音轨）
        shell: pwsh
        run: |
          if ($IsMacOS) {
            # FFmpeg-Builds 没有 macOS 产物；CI 只编译不打包，放占位文件让 tauri-build 的 externalBin 校验通过。
            New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
            Set-Content -Path "src-tauri/binaries/ffmpeg-${{ matrix.triple }}" -Value "" -NoNewline
          } else {
            ./tools/Sync-FwFfmpeg.ps1 -FwTriple ${{ matrix.triple }}
          }

      - name: 安装 Linux 系统依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libssl-dev build-essential curl wget file

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 单元测试（引擎解析与分段规划）
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: 编译检查（含 Tauri 配置与能力文件）
        run: cargo check --manifest-path src-tauri/Cargo.toml
