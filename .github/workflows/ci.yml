name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  version:
    name: 版本号校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验 version.json
        shell: pwsh
        run: ./tools/Test-FwVersion.ps1

  rust:
    name: 编译与测试 (${{ matrix.os }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libssl-dev build-essential curl wget file

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 单元测试（引擎解析与分段规划）
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: 编译检查（含 Tauri 配置与能力文件）
        run: cargo check --manifest-path src-tauri/Cargo.toml
